    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            overflow: hidden;
        }

        /* 村莊天空背景 */
        .village-bg {
            background: linear-gradient(to bottom, #70c4ff 0%, #bde5ff 45%, #a2e896 45%, #468c34 100%);
            position: relative;
            overflow: hidden;
        }

        /* 太陽脈動動畫 */
        .sun {
            position: absolute;
            top: 25px;
            right: 40px;
            width: 75px;
            height: 75px;
            background: radial-gradient(circle, #FFF066 30%, #FF9900 100%);
            border-radius: 50%;
            box-shadow: 0 0 45px #FFD700;
            animation: pulse-sun 4s infinite alternate;
            z-index: 2;
        }

        @keyframes pulse-sun {
            0% { transform: scale(1); box-shadow: 0 0 30px #FFD700; }
            100% { transform: scale(1.1); box-shadow: 0 0 55px #FFD700; }
        }

        /* 純 CSS 移動雲朵動畫 */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50px;
            z-index: 3;
            pointer-events: none;
            animation: cloudMove linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }

        @keyframes cloudMove {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }

        /* 熱氣球飄浮懸停動畫 */
        @keyframes floatAnim {
            0% { transform: translateY(0px) rotate(-1.5deg); }
            50% { transform: translateY(-14px) rotate(1.5deg); }
            100% { transform: translateY(0px) rotate(-1.5deg); }
        }

        .balloon-float {
            animation: floatAnim 3.8s ease-in-out infinite;
        }

        .balloon-wrapper {
            transition: opacity 0.5s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .balloon-wrapper:hover {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            cursor: pointer;
        }

        /* 彈窗動畫 */
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.85) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-animate {
            animation: modalPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 消失縮放動畫 */
        .balloon-disappear {
            opacity: 0 !important;
            transform: scale(0) !important;
            pointer-events: none !important;
        }
    </style>

    <!-- 腳本區域 (Web Audio, Canvas 粒子, 隨機熱氣球, 遊戲邏輯) -->
    <script>
        /* ================= Web Audio API 背景音樂與音效合成器 ================= */
        class WebAudioEngine {
            constructor() {
                this.ctx = null;
                this.bgmTimer = null;
                this.isMuted = false;
                this.bgmStep = 0;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // 播放點擊音效
            playClick() {
                if (this.isMuted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.07);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.07);
            }

            // 答對音效
            playCorrect() {
                if (this.isMuted) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.25);
                });
            }

            // 答錯音效
            playWrong() {
                if (this.isMuted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.setValueAtTime(170, now + 0.15);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }

            // 啟動輕快背景音樂節奏樂章
            startBGM() {
                this.init();
                if (this.bgmTimer) return;
                
                // 輕快旋律音符序列 (C major)
                const melody = [261.63, 329.63, 392.00, 329.63, 349.23, 440.00, 392.00, 329.63];
                this.bgmTimer = setInterval(() => {
                    if (this.isMuted) return;
                    const freq = melody[this.bgmStep % melody.length];
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    this.bgmStep++;
                }, 450);
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                return this.isMuted;
            }
        }

        const audioEngine = new WebAudioEngine();

        /* ================= Canvas 光點與氣泡粒子系統 ================= */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 50;
                this.radius = Math.random() * 4 + 2;
                this.speedY = Math.random() * 1.2 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.alpha = Math.random() * 0.5 + 0.3;
                this.color = `hsla(${Math.random() * 60 + 180}, 80%, 75%, ${this.alpha})`;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'white';
                ctx.fill();
            }
        }

        for (let i = 0; i < 35; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);

        animateParticles();

        /* ================= 題庫與遊戲狀態資料 ================= */
        const quizData = [

            },
            {

                options: ["所有年齡的人領相同的工資", "提供相同的職務與工作價值時，獲得平等的薪資報酬", "男性工作時間越長領越高薪", "依據傳統價值給予特定性別津貼"],

                answer: 2

            {
                question: "科技與工程領域 (STEM) 過去常被視為男性主導，現代性別平權強調什麼？",
                options: ["限制女性報考相關科系", "鼓勵並提供女性平等的學習與發展機會", "將 STEM 領域更名為女性領域", "減少科技領域的研發投資"],

        // 熱氣球色彩組合
        const balloonGradients = [
            "from-rose-500 to-red-400",
            "from-sky-500 to-indigo-500",
            "from-emerald-400 to-teal-600",
            "from-amber-400 to-orange-500",
            "from-purple-500 to-pink-500",
            "from-cyan-400 to-blue-600",
            "from-fuchsia-500 to-rose-600",
            "from-lime-400 to-green-600",

        ];

        let score = 0;
        let answeredCount = 0;
        let currentIdx = null;

        /* ================= 隨機熱氣球佈局生成算法 ================= */
        function generateRandomBalloons() {
            const container = document.getElementById('balloons-container');
            container.innerHTML = '';

            const scaleOptions = [1, 1.2, 1.5]; // 隨機倍率
            const placedPositions = [];

            for (let i = 0; i < 10; i++) {
                let topPercent, leftPercent, overlapping;
                let attempts = 0;

                // 防重疊極限座標嘗試 (Top: 12% ~ 48%, Left: 6% ~ 82%)
                do {
                    overlapping = false;
                    topPercent = 12 + Math.random() * 36;
                    leftPercent = 6 + Math.random() * 76;
                    attempts++;

                    for (let pos of placedPositions) {
                        const dist = Math.hypot(pos.top - topPercent, pos.left - leftPercent);
                        if (dist < 13 && attempts < 100) {
                            overlapping = true;
                            break;
                        }
                    }
                } while (overlapping);

                placedPositions.push({ top: topPercent, left: leftPercent });

                // 隨機選擇尺寸倍數與顏色
                const randomScale = scaleOptions[Math.floor(Math.random() * scaleOptions.length)];
                const gradient = balloonGradients[i % balloonGradients.length];

                // 建立熱氣球 DOM 節點
                const balloonWrapper = document.createElement('div');
                balloonWrapper.className = 'absolute pointer-events-auto balloon-wrapper';
                balloonWrapper.style.top = `${topPercent}%`;
                balloonWrapper.style.left = `${leftPercent}%`;
                balloonWrapper.style.transform = `scale(${randomScale})`;
                balloonWrapper.id = `balloon-${i}`;

                balloonWrapper.innerHTML = `
                    <div class="balloon-float flex flex-col items-center">
                        <!-- 氣球主體 (SVG / HTML 組合) -->
                        <div class="w-16 h-20 bg-gradient-to-b ${gradient} rounded-full shadow-xl relative flex items-center justify-center border-2 border-white/70 overflow-hidden">
                            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-transparent to-black"></div>
                            <span class="text-white font-black text-lg drop-shadow z-10">#${i + 1}</span>
                        </div>
                        <!-- 氣球繩索 -->
                        <div class="w-8 h-2.5 flex justify-between px-1 -mt-0.5">
                            <div class="w-0.5 h-full bg-stone-700/80"></div>
                            <div class="w-0.5 h-full bg-stone-700/80"></div>
                        </div>
                        <!-- 吊籃 -->
                        <div class="w-6 h-4.5 bg-amber-900 rounded-b-md shadow-md border border-amber-950 flex items-center justify-center">
                            <i class="fa-solid fa-user text-[9px] text-amber-200"></i>
                        </div>
                    </div>
                `;

                balloonWrapper.addEventListener('click', () => openQuizModal(i));
                container.appendChild(balloonWrapper);
            }
        }

        /* ================= 遊戲開關與 Modal 操作 ================= */

        // 開啟題目 Modal
        function openQuizModal(idx) {
            audioEngine.playClick();
            currentIdx = idx;
            const q = quizData[idx];

            document.getElementById('modal-balloon-num').innerText = `熱氣球 #${idx + 1}`;
            document.getElementById('question-text').innerText = `${idx + 1}. ${q.question}`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-2xl border-2 border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 font-bold text-gray-700 transition-all flex items-center space-x-3 option-btn`;
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center font-extrabold text-sm shrink-0">
                        ${String.fromCharCode(65 + optIdx)}
                    </span>
                    <span class="flex-grow">${opt}</span>
                `;
                btn.addEventListener('click', () => handleAnswer(optIdx, btn));
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-modal').classList.remove('hidden');
        }

        // 處理答題
        function handleAnswer(selectedOptIdx, btnElement) {
            const q = quizData[currentIdx];
            const allBtns = document.querySelectorAll('.option-btn');
            const feedbackBox = document.getElementById('feedback-box');
            const nextBtn = document.getElementById('next-btn');

            allBtns.forEach(b => b.disabled = true);

            const isCorrect = (selectedOptIdx === q.answer);

            if (isCorrect) {
                audioEngine.playCorrect();
                score++;
                btnElement.classList.remove('border-gray-200', 'hover:border-indigo-500');
                btnElement.classList.add('border-green-500', 'bg-green-100', 'text-green-800');
                
                feedbackBox.className = 'p-4 rounded-xl text-center font-bold mb-4 bg-green-100 text-green-800 border border-green-300';
                feedbackBox.innerHTML = `<i class="fa-solid fa-circle-check text-xl me-2"></i>回答正確！展現了優秀的性別平等觀念！`;
            } else {
                audioEngine.playWrong();
                btnElement.classList.remove('border-gray-200', 'hover:border-indigo-500');
                btnElement.classList.add('border-red-500', 'bg-red-100', 'text-red-800');
                
                allBtns[q.answer].classList.add('border-green-500', 'bg-green-50', 'text-green-800');

                feedbackBox.className = 'p-4 rounded-xl text-center font-bold mb-4 bg-red-100 text-red-800 border border-red-300';
                feedbackBox.innerHTML = `<i class="fa-solid fa-circle-xmark text-xl me-2"></i>回答錯誤，正確答案是 (${String.fromCharCode(65 + q.answer)})`;
            }

            answeredCount++;
            document.getElementById('score-counter').innerText = `${score} / 8`;

            feedbackBox.classList.remove('hidden');
            nextBtn.classList.remove('hidden');

            // 關閉問答並徹底隱藏該熱氣球
            nextBtn.onclick = () => {
                audioEngine.playClick();
                document.getElementById('quiz-modal').classList.add('hidden');

                // 隱藏/消失熱氣球
                const currentBalloon = document.getElementById(`balloon-${currentIdx}`);
                if (currentBalloon) {
                    currentBalloon.classList.add('balloon-disappear');
                    setTimeout(() => {
                        currentBalloon.style.display = 'none';
                    }, 500);
                }

                // 檢查是否提前過關 (>=8 題) 或 題目做完未達標
                checkGameStatus();
            };
        }

        // 檢查遊戲勝負狀態 (只要答對 >= 8 題即可直接過關，不用做完 10 題)
        function checkGameStatus() {
            if (score >= 8) {
                // 提前過關
                setTimeout(() => showResultModal(true), 400);
            } else if (answeredCount >= 10 && score < 8) {
                // 10 題完畢但小於 8 題：失敗
                setTimeout(() => showResultModal(false), 400);
            }
        }

        // 顯示結果 Modal
        function showResultModal(isWin) {
            const resultModal = document.getElementById('result-modal');
            const resultCard = document.getElementById('result-card');
            const iconContainer = document.getElementById('result-icon-container');
            const titleEl = document.getElementById('result-title');
            const descEl = document.getElementById('result-desc');
            const scoreEl = document.getElementById('result-score');
            const actionsEl = document.getElementById('result-actions');

            scoreEl.innerText = `${score} / 8 (總答題: ${answeredCount})`;

            if (isWin) {
                audioEngine.playCorrect();
                resultCard.className = 'bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl text-center modal-animate border-4 border-emerald-400';
                iconContainer.className = 'w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center text-5xl bg-emerald-100 text-emerald-600 shadow-md';
                iconContainer.innerHTML = `<i class="fa-solid fa-trophy"></i>`;
                
                titleEl.innerText = '恭喜順利過關！';
                titleEl.className = 'text-2xl md:text-3xl font-black mb-2 text-emerald-600';
                descEl.innerText = '你已成功達到 8 題答對目標！展現了優秀的性別平等觀念，準備好前往下一關了嗎？';

                actionsEl.innerHTML = `
                    <a href="level2.html" class="block w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black text-lg rounded-2xl shadow-xl transition-all transform hover:-translate-y-0.5 text-center">
                        前往下一關 <i class="fa-solid fa-arrow-right ms-2"></i>
                    </a>
                `;
            } else {
                audioEngine.playWrong();
                resultCard.className = 'bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl text-center modal-animate border-4 border-rose-400';
                iconContainer.className = 'w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center text-5xl bg-rose-100 text-rose-600 shadow-md';
                iconContainer.innerHTML = `<i class="fa-solid fa-rotate-right"></i>`;

                titleEl.innerText = '挑戰失敗';
                titleEl.className = 'text-2xl md:text-3xl font-black mb-2 text-rose-600';
                descEl.innerText = '答對題數未達 8 題標準，請重新挑戰，一起深植 SDGs 性別平權觀念！';

                actionsEl.innerHTML = `
                    <button onclick="window.location.reload();" class="w-full py-4 bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-white font-black text-lg rounded-2xl shadow-xl transition-all transform hover:-translate-y-0.5">
                        <i class="fa-solid fa-rotate-right me-2"></i>重新挑戰
                    </button>
                `;
            }

            resultModal.classList.remove('hidden');
        }

        /* ================= 事件監聽與初始化 ================= */
        document.getElementById('start-game-btn').addEventListener('click', () => {
            audioEngine.playClick();
            audioEngine.startBGM();
            document.getElementById('start-overlay').classList.add('hidden');
        });

        // 音樂開關 Toggle
        document.getElementById('bgm-toggle-btn').addEventListener('click', () => {
            const isMuted = audioEngine.toggleMute();
            const icon = document.getElementById('bgm-icon');
            if (isMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-xl text-red-500';
            } else {
                icon.className = 'fa-solid fa-volume-high text-xl text-indigo-700';
            }
        });

        // 網頁載入時生成隨機位置熱氣球
        window.addEventListener('DOMContentLoaded', () => {
            generateRandomBalloons();
        });
    </script>
</body>
</html>
